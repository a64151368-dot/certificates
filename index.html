<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Атестаційний реєстр (2022–2027)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 50%, #ffffff 0%, #f1f5f9 60%, #e2e8f0 100%);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.9);
      --drawer-bg: #ffffff;
      --accent-blue: #0284c7;
      --accent-purple: #7e22ce;
      --shadow-3d: 0 12px 30px -5px rgba(15, 23, 42, 0.12), 0 4px 10px -2px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Сцена хмари */
    #cloud-stage {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      perspective: 1400px;
      perspective-origin: 50% 46%;
    }

    /* Однакові великі напівпрозорі плашки з 3D об'ємом */
    .cloud-card {
      position: absolute;
      width: 220px;
      height: 95px;
      padding: 12px;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,.97), rgba(248,250,252,.88));
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        0 18px 32px -12px rgba(15,23,42,.24),
        0 6px 14px rgba(15,23,42,.09),
        inset 0 1px 0 rgba(255,255,255,1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transform: translate(-50%, -50%) translateZ(45px);
      transition: transform 0.32s cubic-bezier(.2,.8,.2,1), 
                  box-shadow 0.32s ease, 
                  background 0.32s ease,
                  border-color 0.32s ease;
      z-index: 5;
    }

    .cloud-card-text {
      font-family: 'Unbounded', sans-serif;
      font-size: 0.88rem;
      font-weight: 900;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      word-wrap: break-word;
      white-space: normal;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
      position: relative;
      z-index: 1;
    }

    .cloud-card:hover {
      transform: translate(-50%, -50%) translateZ(75px) scale(1.08) !important;
      z-index: 50 !important;
      background: linear-gradient(145deg, #ffffff, #f5f3ff);
      border-color: var(--accent-purple);
      box-shadow:
        0 28px 48px -12px rgba(49,46,129,.28),
        0 0 0 3px rgba(255,255,255,.9),
        0 0 26px rgba(99,102,241,.24);
    }

    /* Центральна галерея */
    .center-showcase {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(-70px) scale(.94);
      width: min(440px, 42vw);
      height: min(340px, 40vh);
      min-width: 220px;
      min-height: 200px;
      padding: 8px;
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.76), rgba(226,232,240,.48));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.96);
      box-shadow:
        0 32px 70px -24px rgba(30, 64, 175, .28),
        0 12px 28px rgba(15, 23, 42, .12),
        inset 0 1px 0 rgba(255,255,255,.95);
      z-index: 1;
      overflow: hidden;
      isolation: isolate;
    }

    .showcase-image {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 50px;
      width: calc(100% - 16px);
      height: calc(100% - 58px);
      object-fit: contain;
      object-position: center;
      opacity: 0;
      transition: opacity 900ms ease-in-out;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 8px 16px rgba(15,23,42,.10));
    }

    .showcase-image.is-visible { opacity: 1; }

    /* Кнопка на центральному блоці */
    .showcase-btn {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: linear-gradient(135deg, #0284c7, #7e22ce);
      color: #ffffff;
      border: none;
      padding: 9px 22px;
      border-radius: 22px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .showcase-btn:hover {
      transform: translateX(-50%) scale(1.06);
      box-shadow: 0 6px 22px rgba(126, 34, 206, 0.45);
      background: linear-gradient(135deg, #0369a1, #6b21a8);
      color: #ffffff;
    }

    /* Футер із легкою підсвіткою та акцентом */
    footer {
      padding: 14px 24px;
      text-align: center;
      font-size: 0.86rem;
      color: #1e293b;
      border-top: 1px solid rgba(226, 232, 240, 0.8);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      font-weight: 700;
      box-shadow: 0 -6px 25px rgba(15, 23, 42, 0.08);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 1);
      z-index: 10;
    }

    footer span {
      color: var(--accent-purple);
      font-weight: 900;
    }

    /* Бічна панель (Drawer) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -560px;
      width: 100%;
      max-width: 520px;
      height: 100%;
      background:
        radial-gradient(ellipse at 100% 0%, rgba(196, 181, 253, 0.42) 0%, transparent 42%),
        radial-gradient(ellipse at 0% 100%, rgba(125, 211, 252, 0.34) 0%, transparent 45%),
        linear-gradient(145deg, #f8fbff 0%, #f1f5ff 38%, #fff7fb 72%, #f0f9ff 100%);
      border-left: 3px solid rgba(129, 140, 248, 0.72);
      box-shadow: -24px 0 65px rgba(49, 46, 129, 0.17);
      z-index: 1001;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 24px 28px;
      background: linear-gradient(115deg, rgba(224, 242, 254, 0.96) 0%, rgba(237, 233, 254, 0.94) 52%, rgba(252, 231, 243, 0.92) 100%);
      border-bottom: 1px solid rgba(129, 140, 248, 0.28);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-header h2 {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.1rem;
      color: #4338ca;
      font-weight: 800;
      line-height: 1.3;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .btn-close {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-close:hover {
      background: #e11d48;
      color: #ffffff;
      border-color: #e11d48;
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-color: #a5b4fc rgba(224, 231, 255, 0.5);
      scrollbar-width: thin;
    }

    .drawer-content::-webkit-scrollbar {
      width: 9px;
    }

    .drawer-content::-webkit-scrollbar-track {
      background: rgba(224, 231, 255, 0.45);
      border-radius: 12px;
    }

    .drawer-content::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #818cf8, #38bdf8);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 12px;
    }

    .cert-card {
      padding: 20px;
      border: 1px solid rgba(165, 180, 252, 0.42);
      border-radius: 18px;
      background: linear-gradient(140deg, rgba(255,255,255,0.96), rgba(239,246,255,0.88) 58%, rgba(250,245,255,0.92));
      box-shadow: 0 12px 28px rgba(67, 56, 202, 0.08), 0 3px 8px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: text;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .cert-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(67, 56, 202, 0.13), 0 0 0 3px rgba(255,255,255,0.78);
    }

    .cert-card-title {
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1.4;
      color: #172554;
    }

    .cert-card-info {
      font-size: 0.84rem;
      color: #52627a;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-weight: 700;
    }

    .badge-status {
      display: inline-block;
      align-self: flex-start;
      margin-top: 4px;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .status-ok {
      background: rgba(22, 163, 74, 0.12);
      color: #15803d;
      border: 1px solid rgba(22, 163, 74, 0.3);
    }

    .status-info {
      background: rgba(2, 132, 199, 0.12);
      color: #0369a1;
      border: 1px solid rgba(2, 132, 199, 0.3);
    }

    @media (max-width: 600px) {
      #cloud-stage { perspective: 1000px; }
      .center-showcase {
        width: min(78vw, 340px);
        height: min(34vh, 260px);
        min-width: 0;
        min-height: 160px;
        transform: translate(-50%, -50%) translateZ(-45px) scale(.94);
      }
      .cloud-card {
        width: min(220px, 43vw);
        height: 88px;
      }
      .cloud-card-text { font-size: .76rem; }
      .drawer { max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud-card, .showcase-image { transition-duration: .01ms !important; }
    }
  </style>
</head>

      { name: "Математика", color: "#b91c1c" },

      { name: "Психологічна<br>підготовка", rawName: "Психологічна підготовка", color: "#d97706" },

      { name: "Академічна<br>доброчесність", rawName: "Академічна доброчесність", color: "#0891b2" },
      { name: "Домедична<br>допомога", rawName: "Домедична допомога", color: "#e11d48" }
    ];

    function buildCloud() {
      const stage = document.getElementById('cloud-stage');
      const centerBox = document.getElementById('center-showcase');
      stage.innerHTML = '';
      stage.appendChild(centerBox);

      const w = stage.clientWidth || window.innerWidth;
      const h = stage.clientHeight || (window.innerHeight - 60);

      const centerX = w / 2;
      const centerY = h / 2;

      const rx = Math.min(w * 0.40, 460);
      const ry = Math.min(h * 0.38, 260);

      categories.forEach((cat, idx) => {
        const card = document.createElement('div');
        card.className = 'cloud-card';
        
        const keyName = cat.rawName || cat.name.replace('<br>', ' ');
        card.style.borderColor = cat.color;

        const textSpan = document.createElement('span');
        textSpan.className = 'cloud-card-text';
        textSpan.innerHTML = cat.name;
        textSpan.style.color = cat.color;
        card.appendChild(textSpan);

        let angle = (idx / categories.length) * Math.PI * 2 - (Math.PI / 2);
        if (cat.name.includes("Мовленнєва")) {
          angle -= 0.18;
        }

        const x = centerX + Math.cos(angle) * rx;
        const y = centerY + Math.sin(angle) * ry;

        card.style.left = x + 'px';
        card.style.top = y + 'px';

        card.addEventListener('click', (e) => {
          e.stopPropagation();
          showCategory(keyName);
        });

        stage.appendChild(card);
      });
    }

    async function startRandomShowcase() {
      let imageUrls = [];

      try {
        const response = await fetch('https://api.github.com/repos/a64151368-dot/certificates/contents');
        if (response.ok) {
          const files = await response.json();
          imageUrls = files
            .filter(file => file.type === 'file' && /\.(png|jpg|jpeg|webp)$/i.test(file.name))
            .map(file => file.download_url || `https://raw.githubusercontent.com/a64151368-dot/certificates/main/${encodeURIComponent(file.name)}`);
        }
      } catch (err) {
        console.warn("GitHub API fetch warning:", err);
      }

      if (imageUrls.length === 0) {
        imageUrls = Array.from({ length: 35 }, (_, i) => 
          `https://raw.githubusercontent.com/a64151368-dot/certificates/main/${i + 1}.png`
        );
      }

      const slides = [
        document.getElementById('showcase-image-a'),
        document.getElementById('showcase-image-b')
      ];
      let visibleIndex = -1;
      let lastImageIndex = -1;
      let isSwitching = false;

      function pickRandomIndex() {
        if (imageUrls.length < 2) return 0;
        let next;
        do {
          next = Math.floor(Math.random() * imageUrls.length);
        } while (next === lastImageIndex && imageUrls.length > 1);
        lastImageIndex = next;
        return next;
      }

      function showNextImage() {
        if (isSwitching || imageUrls.length === 0) return;
        isSwitching = true;
        const nextIndex = pickRandomIndex();
        const nextSlideIndex = visibleIndex === 0 ? 1 : 0;
        const nextSlide = slides[nextSlideIndex];
        const preload = new Image();
        preload.decoding = 'async';

        preload.onload = () => {
          nextSlide.onload = null;
          nextSlide.onerror = null;
          nextSlide.src = preload.src;
          nextSlide.classList.add('is-visible');
          if (visibleIndex !== -1) {
            slides[visibleIndex].classList.remove('is-visible');
          }
          visibleIndex = nextSlideIndex;
          isSwitching = false;
        };

        preload.onerror = () => {
          isSwitching = false;
        };

        preload.src = imageUrls[nextIndex];
      }

      showNextImage();
      window.setInterval(showNextImage, 5000);
    }

    function showCategory(catName) {
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('overlay');
      const title = document.getElementById('drawer-title');
      const body = document.getElementById('drawer-body');

      const items = data[catName] || [];
      title.innerText = `${catName} (${items.length} документів)`;
      body.innerHTML = '';

      if (items.length === 0) {
        body.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b; font-weight:700;">Записи у цій категорії знаходяться на стадії опрацювання.</div>';
      } else {
        items.forEach(item => {
          const isOk = (item.status || "").includes('ПІДТВЕРДЖЕНО');
          const card = document.createElement('div');
          card.className = 'cert-card';
          card.innerHTML = `
            <div class="cert-card-title">${item.title}</div>
            <div class="cert-card-info">
              <span>📅 Дата: ${item.date}</span>
              <span>⏱️ Обсяг: ${item.hours}</span>
              <span>🏫 Організатор: ${item.organizer}</span>
              <span>📄 Документ: ${item.doc}</span>
            </div>
            <div class="badge-status ${isOk ? 'status-ok' : 'status-info'}">
              ${item.status}
            </div>
          `;
          body.appendChild(card);
        });
      }

      drawer.classList.add('open');
      overlay.classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }

    window.addEventListener('DOMContentLoaded', () => {
      buildCloud();
      startRandomShowcase();
    });
    window.addEventListener('resize', buildCloud);
  </script>
