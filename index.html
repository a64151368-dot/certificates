<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Атестаційний реєстр (2022–2027)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f5fd;
      --ink: #231f3a;
      --muted: #6b6788;
      --purple: #7b5cf0;
      --purple-soft: #ebe6fc;
      --teal: #45a596;
      --teal-soft: #e2f3ef;
      --coral: #ef826f;
      --butter: #fdf1cc;
      --line: #d9d0f5;
      --glass: rgba(255, 255, 255, 0.72);
      --shadow-soft: 0 20px 50px -22px rgba(91, 70, 190, 0.32), 0 6px 18px -8px rgba(35, 31, 58, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--ink);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ===== Фон: м'які плями + формули ===== */
    .aura {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      filter: blur(60px);
      opacity: .9;
    }
    .aura span {
      position: absolute;
      border-radius: 50%;
      animation: drift 26s ease-in-out infinite alternate;
    }
    .aura span:nth-child(1) { width: 46vw; height: 46vw; left: 8%;  top: 10%; background: rgba(196, 181, 253, .55); }
    .aura span:nth-child(2) { width: 40vw; height: 40vw; right: 6%; top: 18%; background: rgba(167, 230, 215, .55); animation-delay: -8s; animation-duration: 30s; }
    .aura span:nth-child(3) { width: 36vw; height: 36vw; left: 34%; bottom: 4%; background: rgba(253, 205, 190, .5); animation-delay: -15s; animation-duration: 34s; }
    .aura span:nth-child(4) { width: 26vw; height: 26vw; left: 60%; top: 52%; background: rgba(253, 236, 180, .55); animation-delay: -4s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(4vw, -3vh) scale(1.08); }
      100% { transform: translate(-3vw, 4vh) scale(.95); }
    }

    #formula-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== Шапка в стилі сайту ===== */
    .page-head {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px clamp(16px, 4vw, 48px) 12px;
      border-bottom: 2px dashed var(--line);
      background: rgba(248, 245, 253, .6);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-script {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: clamp(1.9rem, 3.4vw, 2.6rem);
      line-height: 1;
      background: linear-gradient(100deg, #7b5cf0, #9a7bff 45%, #45a596);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand-pill {
      background: var(--teal);
      color: #fff;
      font-weight: 800;
      font-size: .8rem;
      letter-spacing: .12em;
      padding: 5px 13px;
      border-radius: 999px;
      box-shadow: 0 6px 14px -6px rgba(69, 165, 150, .7);
      white-space: nowrap;
    }
    .head-sub {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.55rem;
      color: var(--teal);
      text-align: right;
      transform: rotate(-2deg);
    }
    .head-sub::before { content: "✦ "; color: var(--coral); font-size: 1rem; vertical-align: middle; }

    /* ===== Сцена хмари ===== */
    #cloud-stage {
      flex: 1;
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      perspective: 1400px;
      perspective-origin: 50% 46%;
    }

    /* Плашки категорій — повітряні, з м'якими краями */
    .cloud-card {
      --c: #7b5cf0;
      position: absolute;
      width: 232px;
      height: 92px;
      transform: translate(-50%, -50%) translateZ(45px);
      transition: transform .5s cubic-bezier(.2,.8,.2,1);
      cursor: pointer;
      z-index: 5;
      opacity: 0;
      animation: card-in .9s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes card-in {
      from { opacity: 0; filter: blur(8px); }
      to   { opacity: 1; filter: blur(0); }
    }

    .cloud-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px 10px 12px;
      border-radius: 46px;
      background:
        radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c) 12%, transparent) 0%, transparent 55%),
        linear-gradient(150deg, rgba(255,255,255,.92), rgba(255,255,255,.62));
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid color-mix(in srgb, var(--c) 22%, white);
      box-shadow:
        0 22px 40px -22px color-mix(in srgb, var(--c) 55%, transparent),
        0 4px 14px -6px rgba(35,31,58,.10),
        inset 0 1px 0 rgba(255,255,255,1),
        inset 0 -10px 24px -16px color-mix(in srgb, var(--c) 30%, transparent);
      animation: float 7s ease-in-out infinite;
      transition: box-shadow .5s ease, background .5s ease, border-color .5s ease;
    }
    /* м'яке сяйво навколо плашки */
    .cloud-card-inner::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 56px;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 22%, transparent), transparent);
      filter: blur(12px);
      opacity: .55;
      z-index: -1;
      transition: opacity .5s ease;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-7px) rotate(.4deg); }
    }

    .cloud-card-symbol {
      flex: none;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
      font-style: italic;
      font-size: 1.45rem;
      color: #fff;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 45%),
        linear-gradient(145deg, color-mix(in srgb, var(--c) 72%, white), var(--c));
      box-shadow: 0 8px 18px -8px var(--c), inset 0 -3px 8px rgba(0,0,0,.08);
    }

    .cloud-card-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
      font-family: 'Nunito', sans-serif;
      font-size: .96rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -.005em;
      color: var(--ink);
      position: relative;
      z-index: 1;
    }
    .cloud-card-count {
      font-family: 'Caveat', cursive;
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1;
      color: var(--c);
      opacity: .9;
    }

    .cloud-card:hover {
      transform: translate(-50%, -50%) translateZ(75px) scale(1.06) !important;
      z-index: 50 !important;
    }
    .cloud-card:hover .cloud-card-inner {
      background:
        radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c) 18%, transparent) 0%, transparent 60%),
        linear-gradient(150deg, #ffffff, rgba(255,255,255,.88));
      border-color: color-mix(in srgb, var(--c) 45%, white);
      box-shadow:
        0 30px 50px -22px color-mix(in srgb, var(--c) 70%, transparent),
        0 0 0 6px color-mix(in srgb, var(--c) 10%, transparent),
        inset 0 1px 0 #fff;
    }
    .cloud-card:hover .cloud-card-inner::before { opacity: 1; }

    /* ===== Центральна галерея ===== */
    .center-showcase {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(-70px) scale(.94);
      width: min(500px, 44vw);
      height: min(390px, 46vh);
      min-width: 240px;
      min-height: 220px;
      z-index: 1;
    }

    /* орбіти навколо галереї */
    .orbits {
      position: absolute;
      inset: -22% -16%;
      pointer-events: none;
      z-index: -1;
    }
    .orbit {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px dashed rgba(123, 92, 240, .28);
      animation: spin 60s linear infinite;
    }
    .orbit::after {
      content: "";
      position: absolute;
      top: 50%;
      left: -6px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 14px 4px rgba(123, 92, 240, .45);
    }
    .orbit.o2 {
      inset: 8% -6%;
      border-color: rgba(69, 165, 150, .32);
      animation-duration: 42s;
      animation-direction: reverse;
      transform: rotate(18deg);
    }
    .orbit.o2::after { background: var(--teal); box-shadow: 0 0 14px 4px rgba(69, 165, 150, .5); top: 0; left: 50%; }
    .orbit.o3 {
      inset: 16% 4%;
      border-style: dotted;
      border-color: rgba(239, 130, 111, .35);
      animation-duration: 28s;
    }
    .orbit.o3::after { background: var(--coral); box-shadow: 0 0 12px 3px rgba(239, 130, 111, .5); top: auto; bottom: -5px; left: 50%; width: 9px; height: 9px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orbit.o2 { animation-name: spin2; }
    @keyframes spin2 { from { transform: rotate(18deg); } to { transform: rotate(-342deg); } }

    /* Плавна «крапля» замість прямокутника */
    .showcase-frame {
      position: absolute;
      inset: 0;
      border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow-soft), inset 0 1px 0 #fff;
      overflow: hidden;
      isolation: isolate;
      animation: blob 16s ease-in-out infinite;
    }
    /* переливна рамка */
    .showcase-frame::before {
      content: "";
      position: absolute;
      inset: -60%;
      background: conic-gradient(from 0deg, #c4b5fd, #a7e6d7, #fdcdbe, #fdecb4, #c4b5fd);
      animation: spin 14s linear infinite;
      z-index: -2;
      opacity: .9;
    }
    .showcase-frame::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: inherit;
      background:
        radial-gradient(ellipse at 50% 45%, #ffffff 0%, rgba(255,255,255,.96) 55%, rgba(247,244,255,.9) 100%);
      z-index: -1;
    }
    @keyframes blob {
      0%, 100% { border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%; }
      33%      { border-radius: 54% 46% 47% 53% / 46% 54% 48% 52%; }
      66%      { border-radius: 49% 51% 55% 45% / 50% 48% 52% 50%; }
    }

    /* Зона для сертифіката — всередині краплі, щоб форма його не обрізала */
    .showcase-stage {
      position: absolute;
      top: 13%;
      bottom: calc(13% + 40px);
      left: 16%;
      right: 16%;
      display: grid;
      grid-template: 100% / 100%;
      place-items: center;
      z-index: 1;
      pointer-events: none;
    }

    .showcase-image {
      grid-area: 1 / 1;
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 16px;
      opacity: 0;
      transform: scale(.96);
      transition: opacity 1100ms ease-in-out, transform 1600ms cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 12px 26px -12px rgba(60, 40, 140, .35), 0 0 0 4px rgba(255,255,255,.9);
    }

    .showcase-image.is-visible { opacity: 1; transform: scale(1); }
    .showcase-image:not([src]) { visibility: hidden; }

    .showcase-btn {
      position: absolute;
      bottom: 11%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: linear-gradient(120deg, #45a596, #7b5cf0 60%, #9a7bff);
      background-size: 180% 100%;
      color: #ffffff;
      border: none;
      padding: 10px 26px;
      border-radius: 999px;
      font-family: 'Nunito', sans-serif;
      font-size: .9rem;
      font-weight: 800;
      letter-spacing: .02em;
      cursor: pointer;
      box-shadow: 0 10px 24px -10px rgba(123, 92, 240, .8);
      transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease, background-position .6s ease;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .showcase-btn::after {
      content: "→";
      transition: transform .35s ease;
    }
    .showcase-btn:hover {
      transform: translateX(-50%) translateY(-2px);
      background-position: 100% 0;
      box-shadow: 0 16px 30px -12px rgba(123, 92, 240, .9);
      color: #ffffff;
    }
    .showcase-btn:hover::after { transform: translateX(3px); }

    /* ===== Футер ===== */
    footer {
      position: relative;
      padding: 13px 24px;
      text-align: center;
      font-size: .9rem;
      color: var(--muted);
      border-top: 2px dashed var(--line);
      background: rgba(255, 255, 255, .6);
      backdrop-filter: blur(14px);
      font-weight: 700;
      z-index: 10;
    }
    footer span {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--purple);
      font-weight: 700;
      padding: 0 .12em;
    }

    /* ===== Бічна панель ===== */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 33, 92, .22);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease;
      z-index: 1000;
    }
    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      --c: #7b5cf0;
      position: fixed;
      top: 12px;
      bottom: 12px;
      right: -600px;
      width: calc(100% - 24px);
      max-width: 560px;
      background:
        radial-gradient(ellipse at 100% 0%, color-mix(in srgb, var(--c) 14%, transparent) 0%, transparent 45%),
        radial-gradient(ellipse at 0% 100%, rgba(167, 230, 215, .30) 0%, transparent 50%),
        radial-gradient(circle, rgba(123, 92, 240, .09) 1.2px, transparent 1.4px) 0 0 / 26px 26px,
        #fbf9ff;
      border-radius: 36px;
      box-shadow: -30px 0 70px -20px rgba(60, 40, 140, .35);
      z-index: 1001;
      transition: right .6s cubic-bezier(.16, 1, .3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawer.open { right: 12px; }

    /* Шапка панелі */
    .drawer-header {
      position: relative;
      padding: 26px 24px 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      overflow: hidden;
    }
    .drawer-header::after {
      content: "";
      position: absolute;
      left: 28px; right: 28px; bottom: 0;
      border-bottom: 2px dashed color-mix(in srgb, var(--c) 30%, #e4dcfa);
    }
    .drawer-glyph {
      position: absolute;
      right: 70px;
      top: -26px;
      font-family: 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif;
      font-style: italic;
      font-size: 9rem;
      line-height: 1;
      color: var(--c);
      opacity: .09;
      pointer-events: none;
      transform: rotate(-8deg);
      animation: glyph-sway 9s ease-in-out infinite;
    }
    @keyframes glyph-sway {
      0%, 100% { transform: rotate(-8deg) translateY(0); }
      50%      { transform: rotate(-3deg) translateY(6px); }
    }

    .drawer-header h2 {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 400;
    }
    .dh-kicker {
      font-family: 'Nunito', sans-serif;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .dh-name {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 2.6rem;
      line-height: .95;
      color: var(--c);
      position: relative;
      display: inline-block;
      align-self: flex-start;
    }
    .dh-underline {
      display: block;
      width: 100%;
      height: 12px;
      margin-top: -2px;
      overflow: visible;
    }
    .dh-underline path {
      stroke: var(--c);
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      opacity: .55;
    }
    .drawer.open .dh-underline path {
      animation: draw-line 1s .35s cubic-bezier(.6,.1,.2,1) forwards;
    }
    @keyframes draw-line { to { stroke-dashoffset: 0; } }

    .dh-count {
      align-self: flex-start;
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 4px;
      padding: 4px 14px 5px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--c) 12%, white);
      color: color-mix(in srgb, var(--c) 80%, #231f3a);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: .82rem;
    }
    .dh-count b {
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
      line-height: 1;
    }

    .btn-close {
      position: relative;
      flex: none;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .35s cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 6px 14px -8px rgba(60,40,140,.4);
    }
    .btn-close:hover {
      background: var(--coral);
      color: #fff;
      border-color: var(--coral);
      transform: rotate(90deg) scale(1.05);
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 22px 22px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-color: #c4b5fd transparent;
      scrollbar-width: thin;
    }
    .drawer-content::-webkit-scrollbar { width: 8px; }
    .drawer-content::-webkit-scrollbar-track { background: transparent; }
    .drawer-content::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 12px; }

    /* Картка сертифіката */
    .cert-card {
      position: relative;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 16px;
      padding: 18px 20px 18px 16px;
      border-radius: 28px;
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--c) 10%, #f1edfb);
      box-shadow: 0 16px 32px -22px rgba(60, 40, 140, .4), 0 2px 6px rgba(35,31,58,.03);
      user-select: text;
      transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease, border-color .4s ease;
      opacity: 0;
      animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cert-card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--c) 30%, white);
      box-shadow: 0 22px 40px -22px color-mix(in srgb, var(--c) 55%, transparent);
    }

    /* «Плитка» з датою, як на основному сайті */
    .cert-date {
      align-self: start;
      width: 74px;
      padding: 12px 4px 10px;
      border-radius: 22px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
        var(--c);
      color: #fff;
      text-align: center;
      box-shadow: 0 10px 20px -10px var(--c);
      transform: rotate(-4deg);
      transition: transform .4s cubic-bezier(.2,.8,.2,1);
    }
    .cert-card:nth-child(even) .cert-date { transform: rotate(3deg); }
    .cert-card:hover .cert-date { transform: rotate(0deg) scale(1.04); }
    .cert-date-day {
      display: block;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.1;
    }
    .cert-date-year {
      display: block;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1;
      opacity: .92;
    }

    .cert-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }
    .cert-card-title {
      font-family: 'Nunito', sans-serif;
      font-size: 1.04rem;
      font-weight: 800;
      line-height: 1.35;
      color: var(--ink);
    }
    .cert-card-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: .9rem;
      color: #4f4a6e;
      font-weight: 600;
    }
    .cert-row {

      const m10 = n % 10, m100 = n % 100;
      if (m10 === 1 && m100 !== 11) return 'документ';
      if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'документи';
      return 'документів';

    function buildCloud() {

      const centerBox = document.getElementById('center-showcase');
      stage.innerHTML = '';
      stage.appendChild(centerBox);

      const w = stage.clientWidth || window.innerWidth;
      const h = stage.clientHeight || (window.innerHeight - 60);

      const centerX = w / 2;
      const centerY = h / 2;

      const isNarrow = w < 600;
      const cardW = isNarrow ? Math.min(170, w * 0.42) : 232;
      const rx = isNarrow ? (w - cardW) / 2 - 6 : Math.min(w * 0.40, 470);
      const ry = isNarrow ? h * 0.43 - 30 : Math.min(h * 0.38, 260);

      categories.forEach((cat, idx) => {
        const card = document.createElement('div');
        card.className = 'cloud-card';

        const keyName = cat.rawName || cat.name.replace('<br>', ' ');
        const count = (data[keyName] || []).length;
        card.style.setProperty('--c', cat.color);
        card.style.animationDelay = (idx * 0.07) + 's';

        const inner = document.createElement('div');
        inner.className = 'cloud-card-inner';
        inner.style.animationDelay = (-idx * 0.83) + 's';
        inner.style.animationDuration = (6 + (idx % 3)) + 's';

        const sym = document.createElement('span');
        sym.className = 'cloud-card-symbol';
        sym.textContent = cat.symbol;

        const textSpan = document.createElement('span');
        textSpan.className = 'cloud-card-text';
        textSpan.innerHTML = `<span>${cat.name}</span><span class="cloud-card-count">${count ? count + ' ' + docsWord(count) : 'в опрацюванні'}</span>`;

        inner.appendChild(sym);
        inner.appendChild(textSpan);
        card.appendChild(inner);

        let angle = (idx / categories.length) * Math.PI * 2 - (Math.PI / 2);
        if (cat.name.includes("Мовленнєва")) {

        }

        let y = centerY + Math.sin(angle) * ry;

          // на телефоні — акуратні ряди над і під галереєю
          const slots = [
            [0.27, 50], [0.73, 50], [0.27, 122], [0.73, 122], [0.5, 194],
            [0.27, -124], [0.73, -124], [0.27, -52], [0.73, -52]
          ];
          const [fx, fy] = slots[idx] || [0.5, centerY];
          x = w * fx;
          y = fy >= 0 ? fy : h + fy;
        }

        card.style.left = x + 'px';
        card.style.top = y + 'px';

        card.addEventListener('click', (e) => {
          e.stopPropagation();
          showCategory(keyName);
        });

        stage.appendChild(card);
      });

      fitShowcase(stage, centerBox, w, h);
    }

    /* Розраховує найбільшу «краплю», яка вміщується між плашками категорій */
    function fitShowcase(stage, box, w, h) {
      const cards = [...stage.querySelectorAll('.cloud-card')];
      if (!cards.length) return;

      const cs = getComputedStyle(stage);
      const persp = parseFloat(cs.perspective) || 1400;
      const ox = w * 0.5, oy = h * 0.46;            // perspective-origin
      const isNarrow = w < 600;
      const zCard = 45, zBox = isNarrow ? -45 : -70;
      const kCard = persp / (persp - zCard);        // плашки виглядають трохи більшими
      const kBox = 0.94 * persp / (persp - zBox);   // галерея — трохи меншою

      const gap = isNarrow ? 12 : 22;               // повітря між краплею і плашками (+ їх «плавання»)
      const float = 8;
      const cx = w / 2;
      let cy = h / 2;

      // реальні прямокутники плашок на екрані
      const rects = cards.map(c => {
        const x = parseFloat(c.style.left), y = parseFloat(c.style.top);
        const pw = c.offsetWidth * kCard, ph = c.offsetHeight * kCard;
        const px = ox + (x - ox) * kCard, py = oy + (y - oy) * kCard;
        return { l: px - pw / 2 - gap, r: px + pw / 2 + gap, t: py - ph / 2 - gap - float, b: py + ph / 2 + gap };
      });

      // на телефоні — ставимо краплю посередині вільної смуги між рядами плашок
      if (isNarrow) {
        const above = rects.filter(R => (R.t + R.b) / 2 < h / 2).map(R => R.b);
        const below = rects.filter(R => (R.t + R.b) / 2 >= h / 2).map(R => R.t);
        if (above.length && below.length) cy = (Math.max(...above) + Math.min(...below)) / 2;
      }
      box.style.top = cy + 'px';

      // точки по периметру кожної плашки
      const pts = [];
      rects.forEach(R => {
        for (let i = 0; i <= 16; i++) {
          const fx = R.l + (R.r - R.l) * i / 16, fy = R.t + (R.b - R.t) * i / 16;
          pts.push([fx - cx, R.t - cy], [fx - cx, R.b - cy], [R.l - cx, fy - cy], [R.r - cx, fy - cy]);
        }
      });
      // і межі сцени
      const edge = 10;

      let best = null;
      for (let ratio = 1.15; ratio <= 1.75; ratio += 0.05) {
        // найбільша піввісь b для цього співвідношення
        let lo = 40, hi = h / 2;
        for (let it = 0; it < 24; it++) {
          const b = (lo + hi) / 2, a = b * ratio;
          let ok = a <= w / 2 - edge && b <= Math.min(cy, h - cy) - edge;
          for (let j = 0; ok && j < pts.length; j++) {
            const [px, py] = pts[j];
            if ((px * px) / (a * a) + (py * py) / (b * b) < 1) ok = false;
          }
          ok ? (lo = b) : (hi = b);
        }
        const area = lo * lo * ratio;
        if (!best || area > best.area) best = { area, a: lo * ratio, b: lo };
      }

      // переводимо екранний розмір у CSS-розмір з урахуванням 3D-зменшення
      const cssW = Math.round((best.a * 2) / kBox);
      const cssH = Math.round((best.b * 2) / kBox);
      box.style.minWidth = '0';
      box.style.minHeight = '0';
      box.style.width = cssW + 'px';
      box.style.height = cssH + 'px';
    }

    async function startRandomShowcase() {
      let imageUrls = [];

      try {
        const response = await fetch('https://api.github.com/repos/a64151368-dot/certificates/contents');
        if (response.ok) {
          const files = await response.json();
          imageUrls = files
            .filter(file => file.type === 'file' && /\.(png|jpg|jpeg|webp)$/i.test(file.name))
            .map(file => file.download_url || `https://raw.githubusercontent.com/a64151368-dot/certificates/main/${encodeURIComponent(file.name)}`);
        }
      } catch (err) {
        console.warn("GitHub API fetch warning:", err);
      }

      if (imageUrls.length === 0) {
        imageUrls = Array.from({ length: 35 }, (_, i) =>
          `https://raw.githubusercontent.com/a64151368-dot/certificates/main/${i + 1}.png`
        );
      }

      const slides = [
        document.getElementById('showcase-image-a'),
        document.getElementById('showcase-image-b')
      ];
      let visibleIndex = -1;
      let lastImageIndex = -1;
      let isSwitching = false;

      function pickRandomIndex() {
        if (imageUrls.length < 2) return 0;
        let next;
        do {
          next = Math.floor(Math.random() * imageUrls.length);
        } while (next === lastImageIndex && imageUrls.length > 1);
        lastImageIndex = next;
        return next;
      }

      function showNextImage() {
        if (isSwitching || imageUrls.length === 0) return;
        isSwitching = true;
        const nextIndex = pickRandomIndex();
        const nextSlideIndex = visibleIndex === 0 ? 1 : 0;
        const nextSlide = slides[nextSlideIndex];
        const preload = new Image();
        preload.decoding = 'async';

        preload.onload = () => {
          nextSlide.onload = null;
          nextSlide.onerror = null;
          nextSlide.src = preload.src;
          nextSlide.classList.add('is-visible');
          if (visibleIndex !== -1) {
            slides[visibleIndex].classList.remove('is-visible');
          }
          visibleIndex = nextSlideIndex;
          isSwitching = false;
        };

        preload.onerror = () => {
          isSwitching = false;
        };

        preload.src = imageUrls[nextIndex];
      }

      showNextImage();
      window.setInterval(showNextImage, 5000);
    }

    function showCategory(catName) {
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('overlay');
      const title = document.getElementById('drawer-title');
      const body = document.getElementById('drawer-body');

      const cat = categories.find(c => (c.rawName || c.name) === catName);
      drawer.style.setProperty('--c', cat ? cat.color : '#7b5cf0');
      document.getElementById('drawer-glyph').textContent = cat ? cat.symbol : '∑';

      const items = data[catName] || [];
      title.innerHTML = `
        <span class="dh-kicker">категорія</span>
        <span class="dh-name">${catName}
          <svg class="dh-underline" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8 C 40 2, 80 12, 120 6 S 180 3, 198 7" fill="none" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <span class="dh-count"><b>${items.length}</b> ${docsWord(items.length)}</span>`;
      body.innerHTML = '';

      if (items.length === 0) {
        body.innerHTML = '<div class="empty-note"><b>скоро тут буде…</b>Записи у цій категорії знаходяться на стадії опрацювання.</div>';
      } else {
        items.forEach((item, i) => {
          const isOk = (item.status || "").includes('ПІДТВЕРДЖЕНО');
          const parts = (item.date || '').split('.');
          const day = parts.length === 3 ? `${parts[0]}.${parts[1]}` : item.date;
          const year = parts.length === 3 ? parts[2] : '';
          const card = document.createElement('div');
          card.className = 'cert-card';
          card.style.animationDelay = (0.15 + i * 0.06) + 's';
          card.innerHTML = `
            <div class="cert-date" title="Дата: ${item.date}">
              <span class="cert-date-day">${day}</span>
              <span class="cert-date-year">${year}</span>
            </div>
            <div class="cert-body">
              <div class="cert-card-title">${item.title}</div>
              <div class="cert-card-info">
                <div class="cert-row"><i>обсяг</i><span>${item.hours}</span></div>
                <div class="cert-row"><i>організатор</i><span>${item.organizer}</span></div>
                <div class="cert-row"><i>документ</i><span>${item.doc}</span></div>
              </div>
              <div class="badge-status ${isOk ? 'status-ok' : 'status-info'}">${item.status}</div>
            </div>
          `;
          body.appendChild(card);
        });
      }

      body.scrollTop = 0;
      drawer.classList.add('open');
      overlay.classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }

    /* ===== Анімований фон із формулами фізики та математики ===== */
    function startFormulaBackground() {
      const canvas = document.getElementById('formula-bg');
      const ctx = canvas.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const formulas = [
        'E = mc²', 'F = ma', 'a² + b² = c²', 'e^{iπ} + 1 = 0', '∫ f(x) dx', 'Σ 1/n² = π²/6',
        'λ = c / ν', 'p = mv', 'sin²α + cos²α = 1', '∇ · E = ρ / ε₀', 'ΔxΔp ≥ ħ/2', 'v = s / t',
        'U = IR', 'Ek = mv²/2', 'y = kx + b', 'lim (1 + 1/n)ⁿ = e', 'P = A / t', 'ω = 2π / T',
        'x = (−b ± √D) / 2a', 'F = G·m₁m₂/r²', 'S = πr²', 'Q = cmΔt', 'f′(x)', 'φ = (1+√5)/2',
        'pV = νRT', 'n = c / v', 'log₂ 8 = 3', 'E = hν', '∮ B·dl = μ₀I', 'cos 60° = ½'
      ];
      const palette = ['123, 92, 240', '69, 165, 150', '239, 130, 111', '106, 99, 230', '217, 138, 43'];

      let W = 0, H = 0, dpr = 1, items = [], mouse = { x: 0, y: 0, tx: 0, ty: 0 };

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round(Math.min(34, Math.max(14, (W * H) / 52000)));
        items = Array.from({ length: count }, (_, i) => ({
          text: formulas[i % formulas.length].replace('e^{iπ}', 'e^iπ'),
          x: Math.random() * W,
          y: Math.random() * H,
          size: 14 + Math.random() * 16,
          depth: 0.3 + Math.random() * 0.9,
          vx: (Math.random() - .5) * 0.12,
          vy: -0.05 - Math.random() * 0.12,
          rot: (Math.random() - .5) * 0.5,
          vr: (Math.random() - .5) * 0.0006,
          color: palette[i % palette.length],
          phase: Math.random() * Math.PI * 2,
          alpha: 0.14 + Math.random() * 0.16
        }));
      }

      window.addEventListener('mousemove', e => {
        mouse.tx = (e.clientX / W - .5);
        mouse.ty = (e.clientY / H - .5);
      });

      function drawGrid() {
        ctx.save();
        ctx.fillStyle = 'rgba(123, 92, 240, 0.10)';
        const step = 32;
        for (let x = step / 2; x < W; x += step) {
          for (let y = step / 2; y < H; y += step) {
            ctx.fillRect(x, y, 1.4, 1.4);
          }
        }
        ctx.restore();
      }

      function drawWaves(t) {
        const waves = [
          { amp: 26, len: 0.006, speed: 0.00035, y: H * 0.78, color: 'rgba(123, 92, 240, 0.16)' },
          { amp: 18, len: 0.009, speed: -0.0005, y: H * 0.82, color: 'rgba(69, 165, 150, 0.18)' },
          { amp: 34, len: 0.004, speed: 0.00025, y: H * 0.22, color: 'rgba(239, 130, 111, 0.12)' }
        ];
        waves.forEach(wv => {
          ctx.beginPath();
          for (let x = 0; x <= W; x += 6) {
            const y = wv.y + Math.sin(x * wv.len + t * wv.speed) * wv.amp * Math.sin(t * 0.0002 + x * 0.001);
            x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.strokeStyle = wv.color;
          ctx.lineWidth = 1.6;
          ctx.stroke();
        });
      }

      function frame(t) {
        ctx.clearRect(0, 0, W, H);
        drawGrid();
        drawWaves(t || 0);

        mouse.x += (mouse.tx - mouse.x) * 0.04;
        mouse.y += (mouse.ty - mouse.y) * 0.04;

        items.forEach(it => {
          if (!reduce) {
            it.x += it.vx * it.depth;
            it.y += it.vy * it.depth;
            it.rot += it.vr;
            if (it.y < -40) { it.y = H + 40; it.x = Math.random() * W; }
            if (it.x < -200) it.x = W + 100;
            if (it.x > W + 200) it.x = -100;
          }
          const px = it.x - mouse.x * 40 * it.depth;
          const py = it.y - mouse.y * 30 * it.depth;
          const pulse = 0.75 + 0.25 * Math.sin((t || 0) * 0.0008 + it.phase);
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(it.rot);
          ctx.font = `italic ${Math.round(it.size * it.depth + 6)}px 'Cambria Math', 'STIX Two Math', 'Times New Roman', serif`;
          ctx.fillStyle = `rgba(${it.color}, ${it.alpha * pulse})`;
          ctx.fillText(it.text, 0, 0);
          ctx.restore();
        });

        if (!reduce) requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener('resize', () => { resize(); if (reduce) frame(0); });
      reduce ? frame(0) : requestAnimationFrame(frame);
    }

    window.addEventListener('DOMContentLoaded', () => {
      buildCloud();
      startRandomShowcase();
      startFormulaBackground();
    });
    window.addEventListener('resize', buildCloud);
  </script>
